name: Build

on:
  workflow_call:
    inputs:
      macos:
        type: boolean
        default: false
      windows:
        type: boolean
        default: false
      linux-aarch64:
        type: boolean
        default: false
      release:
        type: boolean
        default: false
      production:
        type: boolean
        default: false
      docker:
        type: boolean
        default: false

env:
  TERM: xterm-256color
  RUST_BACKTRACE: short
  RUST_LIB_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_INCREMENTAL: 0
  NEXTEST_PROFILE: ci
  DOCKER_BUILD_SUMMARY: false

jobs:
  beefy-smoke-checks:
    runs-on: ubuntu-24.04
    steps:
      - name: "ACTIONS: Checkout"
        uses: actions/checkout@v7

      - name: "Install: Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: "Install: Pinned CI smoke dependencies"
        run: npm ci --prefix scripts --ignore-scripts --no-audit --no-fund

      - name: "Test: Local-only smoke guard"
        run: npm test --prefix scripts

  dynamic-matrix:
    runs-on: ubuntu-24.04
    outputs:
      profiles: ${{ steps.profiles.outputs.value }}
      targets: ${{ steps.targets.outputs.targets }}
      unix-targets: ${{ steps.targets.outputs.unix-targets }}
      ethexe-targets: ${{ steps.targets.outputs.ethexe-targets }}
    steps:
      - id: profiles
        run: |
          profiles=$(jq -c -n '[{name: "debug", flags: ""}]')
          if ${{ inputs.release }}; then
            profiles=$(echo "$profiles" | jq -c '. += [{name: "release", flags: "--release"}]')
          fi
          echo "Profiles: ${profiles}"
          echo "value=${profiles}" >> "$GITHUB_OUTPUT"
      - id: targets
        run: |
          targets=$(jq -c -n '[
            {
              name: "linux-x86_64",
              target: "x86_64-unknown-linux-gnu",
              "runs-on": "ubuntu-24.04"
            }
          ]')
          ethexe_targets=$(jq -c -n '[
            {
              name: "linux-x86_64",
              target: "x86_64-unknown-linux-gnu",
              "runs-on": "ubuntu-24.04"
            }
          ]')
          unix_targets="[]"

          if ${{ inputs.macos }}; then
            macos='[
              {
                name: "macos-aarch64",
                target: "aarch64-apple-darwin",
                "runs-on": "macos-latest"
              },
              {
                name: "macos-x86_64",
                target: "x86_64-apple-darwin",
                "runs-on": "macos-latest"
              }
            ]'
            targets=$(echo "$targets" | jq -c ". += $macos")
            ethexe_targets=$(echo "$ethexe_targets" | jq -c ". += $macos")
            unix_targets=$(echo "$unix_targets" | jq -c ". += $macos")
          fi

          if ${{ inputs.linux-aarch64 }}; then
            linux_aarch64='[
              {
                name: "linux-aarch64",
                target: "aarch64-unknown-linux-gnu",
                "runs-on": "ubuntu-24.04-arm"
              }
            ]'
            targets=$(echo "$targets" | jq -c ". += $linux_aarch64")
            ethexe_targets=$(echo "$ethexe_targets" | jq -c ". += $linux_aarch64")
            unix_targets=$(echo "$unix_targets" | jq -c ". += $linux_aarch64")
          fi

          if ${{ inputs.windows }}; then
            targets=$(echo "$targets" | jq -c '. += [
              {
                name: "windows-x86_64",
                target: "x86_64-pc-windows-msvc",
                "runs-on": "ubuntu-24.04"
              }
            ]')
            ethexe_targets=$(echo "$ethexe_targets" | jq -c '. += [
              {
                name: "windows-x86_64",
                target: "x86_64-pc-windows-msvc",
                "runs-on": "ubuntu-24.04-arm"
              }
            ]')
          fi

          echo "Targets: ${targets}"
          echo "targets=${targets}" >> "$GITHUB_OUTPUT"

          echo "ethexe targets: ${ethexe_targets}"
          echo "ethexe-targets=${ethexe_targets}" >> "$GITHUB_OUTPUT"

          echo "*NIX targets: ${unix_targets}"
          echo "unix-targets=${unix_targets}" >> "$GITHUB_OUTPUT"

  gear-cli:
    needs: [dynamic-matrix, beefy-smoke-checks]
    strategy:
      fail-fast: false
      matrix:
        targets: ${{ fromJSON(needs.dynamic-matrix.outputs.targets) }}
    runs-on: ${{ matrix.targets.runs-on }}
    name: gear-cli (${{ matrix.targets.name }})
    steps:
      - name: "ACTIONS: Checkout"
        uses: actions/checkout@v7

      - name: "Install: Setup linker"
        uses: ./.github/actions/setup-linker

      - name: "Install: Rust toolchain"
        uses: ./.github/actions/install-rust

      - name: "Install: Compilation environment"
        uses: ./.github/actions/setup-compilation-env
        with:
          target: ${{ matrix.targets.target }}

      - name: "Disable workspace-hack"
        uses: ./.github/actions/disable-workspace-hack

      - name: "Build: Gear node"
        run: ./scripts/gear.sh build node --release --locked

      - name: "Build: Prepare artifact"
        run: |
          mkdir -p artifact/wbuild/vara-runtime
          cp target/${{ matrix.targets.target }}/release/gear* artifact/
          cp target/${{ matrix.targets.target }}/release/wbuild/vara-runtime/*.wasm artifact/wbuild/vara-runtime/

      - name: "ACTIONS: Upload node and VARA runtime"
        uses: actions/upload-artifact@v7
        with:
          name: gear-cli-and-runtime-release-${{ matrix.targets.target }}
          path: artifact

      - name: "Install: Node.js for disposable BEEFY smoke"
        if: matrix.targets.name == 'linux-x86_64'
        uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: "Install: Pinned smoke dependencies"
        if: matrix.targets.name == 'linux-x86_64'
        run: npm ci --prefix scripts --ignore-scripts --no-audit --no-fund

      - name: "Build: Isolated fast-runtime BEEFY smoke node"
        if: matrix.targets.name == 'linux-x86_64'
        env:
          CARGO_TARGET_DIR: target/beefy-smoke
          WASM_BUILD_TYPE: release
        run: cargo build -p gear-cli --release --locked --features fast-runtime

      - name: "Test: Native BEEFY activation, protected restart, rotation and purge"
        if: matrix.targets.name == 'linux-x86_64'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          umask 077
          base=$(mktemp -d "$RUNNER_TEMP/beefy-smoke.XXXXXX")
          alice_pid='' bootstrap_bob_pid='' bob_pid=''
          cleanup() {
            for pid in "$alice_pid" "$bootstrap_bob_pid" "$bob_pid"; do
              if [[ -n "$pid" ]]; then kill "$pid" 2>/dev/null || true; fi
            done
            wait || true
            rm -rf -- "$base"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          mkdir -p "$base/logs" "$base/keystore-bob" beefy-smoke-logs
          openssl rand -hex 32 > "$base/bob-password"
          chmod 600 "$base/bob-password"
          node=target/beefy-smoke/${CARGO_BUILD_TARGET}/release/gear
          common=(--chain local --validator --unsafe-force-node-key-generation --force-authoring
            --enable-offchain-indexing true --rpc-methods unsafe
            --state-pruning archive --blocks-pruning archive
            --no-mdns --no-telemetry --no-prometheus)
          "$node" "${common[@]}" --alice --base-path "$base/alice" --rpc-port 9944 \
            --listen-addr /ip4/127.0.0.1/tcp/30333 > "$base/logs/alice.log" 2>&1 &
          alice_pid=$!
          wait_rpc() {
            timeout 120 bash -s "$1" <<'RPC'
          until curl --fail --silent --max-time 2 -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"system_localPeerId","params":[]}' "$1" \
            | jq -er '.result | select(type == "string")'; do sleep 1; done
          RPC
          }
          alice_peer=$(wait_rpc http://127.0.0.1:9944)
          "$node" "${common[@]}" --bob --base-path "$base/bootstrap-bob" --rpc-port 9946 \
            --listen-addr /ip4/127.0.0.1/tcp/30335 \
            --bootnodes "/ip4/127.0.0.1/tcp/30333/p2p/$alice_peer" \
            > "$base/logs/bootstrap-bob.log" 2>&1 &
          bootstrap_bob_pid=$!
          wait_rpc http://127.0.0.1:9946
          protected_bob=(--name Bob --base-path "$base/bob" --rpc-port 9945
            --listen-addr /ip4/127.0.0.1/tcp/30334
            --bootnodes "/ip4/127.0.0.1/tcp/30333/p2p/$alice_peer"
            --keystore-path "$base/keystore-bob" --password-filename "$base/bob-password")
          "$node" "${common[@]}" "${protected_bob[@]}" > "$base/logs/bob.log" 2>&1 &
          bob_pid=$!
          wait_rpc http://127.0.0.1:9945
          # Upload only the driver's public evidence, never raw node logs or private files.
          node scripts/beefy-activation-smoke.mjs ws://127.0.0.1:9944 ws://127.0.0.1:9945 \
            | tee beefy-smoke-logs/proof.json
          kill "$bootstrap_bob_pid" "$bob_pid"
          wait "$bootstrap_bob_pid" || true
          wait "$bob_pid" || true
          bootstrap_bob_pid='' bob_pid=''
          "$node" "${common[@]}" "${protected_bob[@]}" > "$base/logs/bob-after-restart.log" 2>&1 &
          bob_pid=$!
          wait_rpc http://127.0.0.1:9945
          node scripts/beefy-activation-smoke.mjs ws://127.0.0.1:9944 ws://127.0.0.1:9945 --after-restart \
            | tee beefy-smoke-logs/proof-after-restart.json

      - name: "ACTIONS: Upload BEEFY smoke evidence"
        if: ${{ !cancelled() && matrix.targets.name == 'linux-x86_64' }}
        uses: actions/upload-artifact@v7
        with:
          name: beefy-activation-smoke
          path: |
            beefy-smoke-logs/proof.json
            beefy-smoke-logs/proof-after-restart.json
          if-no-files-found: error

  ethexe-cli:
    needs: dynamic-matrix
    strategy:
      fail-fast: false
      matrix:
        targets: ${{ fromJSON(needs.dynamic-matrix.outputs.ethexe-targets) }}
    runs-on: ${{ matrix.targets.runs-on }}
    name: ethexe-cli (${{ matrix.targets.name }})
    steps:
      - name: "ACTIONS: Checkout"
        uses: actions/checkout@v7

      - name: "Install: Setup linker"
        uses: ./.github/actions/setup-linker

      - name: "Install: Rust toolchain"
        uses: ./.github/actions/install-rust

      - name: "Install: Compilation environment"
        uses: ./.github/actions/setup-compilation-env
        with:
          target: ${{ matrix.targets.target }}

      - name: "Disable workspace-hack"
        uses: ./.github/actions/disable-workspace-hack

      - name: "Build: ethexe node"
        run: ./scripts/gear.sh build ethexe --release --locked

      - name: "ACTIONS: Upload ethexe node"
        uses: actions/upload-artifact@v7
        with:
          name: ethexe-cli-release-${{ matrix.targets.target }}
          path: target/${{ matrix.targets.target }}/release/ethexe*

  docs:
    needs: gear-cli
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup linker
        uses: ./.github/actions/setup-linker

      - name: Install Rust toolchain
        uses: ./.github/actions/install-rust

      - name: Install compilation environment
        uses: ./.github/actions/setup-compilation-env
        with:
          target: x86_64-unknown-linux-gnu

      - name: "Disable workspace-hack"
        uses: ./.github/actions/disable-workspace-hack

      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
          __GEAR_WASM_BUILDER_NO_BUILD: 1
          SKIP_WASM_BUILD: 1

      # TODO: uncomment once caching fixed
      # - run: ./scripts/gear.sh test docs
      #   env:
      #     RUSTFLAGS: "-D warnings"
      #     __GEAR_WASM_BUILDER_NO_BUILD: 1
      #     SKIP_WASM_BUILD: 1

  workspace:
    needs: [dynamic-matrix, gear-cli]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        profiles: ${{ fromJSON(needs.dynamic-matrix.outputs.profiles) }}
      fail-fast: false
    name: workspace (${{ matrix.profiles.name }})
    steps:
      - name: "ACTIONS: Checkout"
        uses: actions/checkout@v7

      - name: "Install: Setup linker"
        uses: ./.github/actions/setup-linker

      - name: "Install: Rust toolchain"
        uses: ./.github/actions/install-rust

      - name: "Install: Compilation environment"
        uses: ./.github/actions/setup-compilation-env
        with:
          target: x86_64-unknown-linux-gnu

      - name: "Disable workspace-hack"
        uses: ./.github/actions/disable-workspace-hack

      - name: "Install: Foundry"
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Install dependencies
        run: forge soldeer install
        working-directory: ./ethexe/contracts

      - name: "Show: Versioning"
        run: |
          ./scripts/gear.sh show
          forge --version

      - name: "Build: Init"
        run: ./scripts/gear.sh init cargo

      - name: "Build: Workspace"
        run: cargo build --workspace --all-targets --all-features ${{ matrix.profiles.flags }}

      - name: "ACTIONS: Upload example WASMs"
        uses: actions/upload-artifact@v7
        with:
          name: examples-${{ matrix.profiles.name }}-wasm32-gear
          path: target/wasm32-gear/${{ matrix.profiles.name }}

      - name: "ACTIONS: Download node and runtime"
        uses: actions/download-artifact@v8
        with:
          name: gear-cli-and-runtime-release-x86_64-unknown-linux-gnu
          path: gear-cli-and-runtime-release

      - name: "Test: Workspace"
        run: |
          # Temporary solution since GitHub Actions runners are quite slow for our tests
          if [ -z "${{ matrix.profiles.flags }}" ]; then
            sed -i 's/slow-timeout = { period = "1m"/slow-timeout = { period = "2m"/' .config/nextest.toml
          fi

          cargo nextest run --workspace --all-targets --all-features -E 'not package(/fuzz/)' ${{ matrix.profiles.flags }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEAR_NODE_WRAPPER_LOG: info
          RUST_LOG: "gear=trace,\
            pallet=trace,\
            gsdk=trace,\
            gcli=trace,\
            ethexe=trace,\
            runtime=trace,\
            runtime::election-provider=debug,\
            syscalls=trace,\
            gwasm=trace"

      - name: "ACTIONS: Upload junit.xml"
        if: "!cancelled()"
        uses: actions/upload-artifact@v7
        with:
          name: "workspace-${{ matrix.profiles.name }}-junit"
          path: target/nextest/ci/junit.xml

  crates-io:
    runs-on: ubuntu-24.04
    needs: workspace
    steps:
      - name: "ACTIONS: Checkout"
        uses: actions/checkout@v7

      - name: "Install: Setup linker"
        uses: ./.github/actions/setup-linker

      - name: "Install: Rust stable toolchain"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: "Disable workspace-hack"
        uses: ./.github/actions/disable-workspace-hack

      - name: "Test: crates-io packages publishing"
        run: cargo +stable run --release -p crates-io publish --simulate --registry-path /tmp/cargo-http-registry

  try-runtime:
    needs: [dynamic-matrix, gear-cli]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        profiles: ${{ fromJSON(needs.dynamic-matrix.outputs.profiles) }}
      fail-fast: false
    name: try-runtime (${{ matrix.profiles.name }})
    steps:
      - name: "ACTIONS: Checkout"
        uses: actions/checkout@v7

      - name: "Install: Setup linker"
        uses: ./.github/actions/setup-linker

      - name: "Install: Rust toolchain"
        uses: ./.github/actions/install-rust

      - name: "Install: Compilation environment"
        uses: ./.github/actions/setup-compilation-env
        with:
          target: x86_64-unknown-linux-gnu

      - name: "Disable workspace-hack"
        uses: ./.github/actions/disable-workspace-hack

      - name: "Install: try-runtime CLI"
        run: |
          curl --fail --show-error --location https://github.com/paritytech/try-runtime-cli/releases/download/v0.10.1/try-runtime-x86_64-unknown-linux-musl -o try-runtime
          chmod +x ./try-runtime

      - name: "Build: Vara mainnet runtime"
        run: cargo build -p vara-runtime -F std,try-runtime --locked ${{ matrix.profiles.flags }}

      - name: "Test: Download pinned Vara Mainnet snapshot"
        run: |
          # Mainnet vara/11000, block 36389444:
          # 0xc939bb95522cfa201167cfc3b87d4a36084a38a5e155fc7cbf46106b73e859e5
          curl --fail --show-error --location https://archive.vara.network/runtime.snap -o vara_ci.snap
          echo "edd8cafd44a9afc141acdd207bfecb2da0e09e28381c0d62aae8c2d6e05f8e36  vara_ci.snap" | sha256sum --check --strict

      - name: "Test: on-runtime-upgrade"
        # Vara has no multi-block migrator; keep the real predecessor for pre/post checks.
        run: >-
          ./try-runtime
          --runtime target/x86_64-unknown-linux-gnu/${{ matrix.profiles.name }}/wbuild/vara-runtime/vara_runtime.wasm
          on-runtime-upgrade
          --blocktime 3000
          --checks all
          --disable-mbm-checks
          snap -p vara_ci.snap

  fuzzer:
    if: false # temporarily disabled until we fix it
    runs-on: ubuntu-24.04
    needs: workspace
    env:
      RUSTFLAGS: "--cfg fuzz"
    steps:
      - name: Cancel Previous Runs
        if: ${{ github.event_name == 'pull_request' }}
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}

      - name: "ACTIONS: Checkout"
        uses: actions/checkout@v7

      - name: "Install: Setup linker"
        uses: ./.github/actions/setup-linker

      - name: "Install deps"
        run: |
          sudo apt update
          sudo apt install -y xxd

      - name: "MOUNT: Logs path"
        run: |
          FUZZER_LOGS_PATH=/mnt/fuzzer_logs
          sudo mkdir -p "$FUZZER_LOGS_PATH"
          sudo ln -s "$FUZZER_LOGS_PATH/artifacts" "$PWD/vara/tools/runtime-fuzzer/fuzz/artifacts"
          sudo ln -s "$FUZZER_LOGS_PATH/proptest-regressions" "$PWD/vara/tools/runtime-fuzzer/proptest-regressions"

      - name: "Install: Rust toolchain"
        uses: ./.github/actions/install-rust

      - name: "Disable workspace-hack"
        uses: ./.github/actions/disable-workspace-hack

      - name: "Install: cargo-nextest"
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C "${CARGO_HOME:-~/.cargo}/bin"

      - name: "Install: cargo-fuzz"
        run: cargo install cargo-fuzz

      - name: "Build fuzzer"
        run: ./scripts/gear.sh build fuzz --locked

      - name: "Run: runtime-fuzzer crate tests"
        run: ./scripts/gear.sh test fuzzer-tests

      - name: "Check: fuzzer competence with mutation test"
        run: ./scripts/check-fuzzer.sh

      - name: "Check: lazy pages fuzzer with smoke test"
        run: ./scripts/check-lazy-pages-fuzzer.sh

      - name: "Log: fuzzer run output"
        if: "!cancelled()"
        run: cat fuzz_run

      - name: "Log: lazy pages fuzzer run output"
        if: "!cancelled()"
        run: cat lazy_pages_fuzz_run

  production:
    runs-on: ubuntu-24.04
    needs: [dynamic-matrix, workspace]
    if: ${{ inputs.production && contains(fromJSON(needs.dynamic-matrix.outputs.profiles).*.name, 'release') }}
    steps:
      - name: "ACTIONS: Checkout"
        uses: actions/checkout@v7

      - name: "Install: Setup linker"
        uses: ./.github/actions/setup-linker

      - name: "Install: Rust toolchain"
        uses: ./.github/actions/install-rust

      - name: "Install: Protoc"
        uses: StackOverflowExcept1on/setup-protoc@node24

      - name: "ACTIONS: Download example WASMs"
        uses: actions/download-artifact@v8
        with:
          name: examples-release-wasm32-gear
          path: examples-artifact

      - name: "ACTIONS: Disable workspace hack"
        uses: ./.github/actions/cargo-hakari
        with:
          # production binaries should not have additional features enabled for deps, too
          args: disable

      - name: "ACTIONS: Disable workspace hack"
        uses: ./.github/actions/cargo-hakari
        with:
          # also don't compile manually written deps in the hack
          args: remove-deps --yes

      - name: "Build: Production binaries"
        run: cargo build -p wasm-proc -p gear-cli -F cli --profile production

      - name: "Build: Production ethexe"
        run: cargo build -p ethexe-cli --profile production

      - name: Prepare artifacts
        run: |
          mkdir artifact

          # examples
          (cd examples-artifact && tar czvf ../artifact/examples.tar.gz ./*.wasm)

          # runtime
          cp target/production/wbuild/vara-runtime/vara_runtime.compact.compressed.wasm artifact/
          cp target/production/wbuild/vara-runtime/vara_runtime.compact.wasm artifact/
          cp target/production/wbuild/vara-runtime/vara_runtime.wasm artifact/

          # executables
          cp target/production/gear artifact/
          cp target/production/wasm-proc artifact/
          cp target/production/ethexe artifact/

      - name: Upload artifacts
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@v7
        with:
          path: artifact

  docker-build:
    name: Build Docker images for gear-cli, ethexe-cli (linux-x86_64)
    runs-on: ubuntu-24.04
    needs: [dynamic-matrix, gear-cli, ethexe-cli]
    if: ${{ contains(fromJSON(needs.dynamic-matrix.outputs.profiles).*.name, 'release') || inputs.docker }}
    steps:
      - name: "ACTIONS: Checkout"
        uses: actions/checkout@v7

      - name: "ACTIONS: Download gear-cli artifact"
        uses: actions/download-artifact@v8
        with:
          name: gear-cli-and-runtime-release-x86_64-unknown-linux-gnu
          path: gear-cli

      - name: "ACTIONS: Download ethexe-cli artifact"
        uses: actions/download-artifact@v8
        with:
          name: ethexe-cli-release-x86_64-unknown-linux-gnu
          path: ethexe-cli

      - name: "Docker: Set up Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "Docker: Login to GHCR"
        if: ${{ github.event_name == 'push' && github.repository == 'gear-tech/gear' && github.ref == 'refs/heads/master' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Build: Generate Dockerfile for gear-cli"
        run: |
          cat <<'EOF' > Dockerfile.gear-cli
          FROM debian:13-slim
          RUN apt-get update && apt-get upgrade -y && apt-get install -y ca-certificates && rm -rf /var/lib/apt/lists/*
          COPY gear-cli/gear /usr/local/bin/gear
          RUN chmod +x /usr/local/bin/gear
          ENTRYPOINT ["/usr/local/bin/gear"]
          EOF

      - name: "Build: Generate Dockerfile for ethexe-cli"
        run: |
          cat <<'EOF' > Dockerfile.ethexe-cli
          FROM debian:13-slim
          RUN apt-get update && apt-get upgrade -y && apt-get install -y ca-certificates && rm -rf /var/lib/apt/lists/*
          COPY ethexe-cli/ethexe /usr/local/bin/ethexe
          RUN chmod +x /usr/local/bin/ethexe
          ENTRYPOINT ["/usr/local/bin/ethexe"]
          EOF

      - name: "Docker: Build & push gear-cli image"
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.gear-cli
          push: ${{ github.event_name == 'push' && github.repository == 'gear-tech/gear' && github.ref == 'refs/heads/master' }}
          tags: ghcr.io/gear-tech/vara:${{ github.sha }}

      - name: "Docker: Build & push ethexe-cli image"
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ethexe-cli
          push: ${{ github.event_name == 'push' && github.repository == 'gear-tech/gear' && github.ref == 'refs/heads/master' }}
          tags: ghcr.io/gear-tech/vara.eth:${{ github.sha }}

  unix:
    needs: [dynamic-matrix, workspace]
    # Optional macOS and Linux ARM targets can leave this matrix empty.
    if: ${{ needs.dynamic-matrix.outputs.unix-targets != '[]' }}
    uses: ./.github/workflows/build-unix.yml
    secrets: inherit
    with:
      profiles: ${{ needs.dynamic-matrix.outputs.profiles }}
      targets: ${{ needs.dynamic-matrix.outputs.unix-targets }}

  windows:
    needs: [dynamic-matrix, workspace]
    if: ${{ inputs.windows }}
    uses: ./.github/workflows/build-windows.yml
    secrets: inherit
    with:
      profiles: ${{ needs.dynamic-matrix.outputs.profiles }}
